<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Reset password — FlowStock</title><link rel="stylesheet" href="./app.css"></head>
<body><main class="auth"><section class="loginpane"><div class="loginbox">
<h2>Reset password</h2>
<p id="instructions">Enter your warehouse account email to request a reset link.</p>
<form id="requestReset">
<div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" required></div>
<button class="btn primary" type="submit">Send reset link</button>
</form>
<form id="updatePassword" hidden>
<div class="field"><label for="password">New password</label><input id="password" name="password" type="password" minlength="12" autocomplete="new-password" required></div>
<div class="field"><label for="confirm">Confirm new password</label><input id="confirm" name="confirm" type="password" minlength="12" autocomplete="new-password" required></div>
<button class="btn primary" type="submit">Save new password</button>
</form>
<p id="message" role="status" aria-live="polite"></p>
<p><a href="./">Back to sign in</a></p>
</div></section></main><script type="module" src="./js/password-reset.js"></script></body></html>
